[project]
name = "flappy-bird"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "typer>=0.27.2",
]

[project.scripts]
flappy-bird = "main:app"


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "src*", "game*"]
namespaces = true
